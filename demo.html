<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecSight</title>
    <meta name="description" content="SpecSight checks AI-generated code against the specs of your task before peer review." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
:root {
  --bg0: #050507;
  --bg1: #0b0a10;
  --panel: #111016;
  --panel2: #16151d;
  --line: #2e2c38;
  --line2: #3a3846;
  --tx: #f5f3ff;
  --sub: #bdb7d6;
  --mut: #9a93bc;
  --ac: #c4b5fd;
  --ac2: #8b5cf6;
  --pass: #86d4c2;
  --fail: #ff8f7e;
  --wait: #f6c177;
  --sky: #7dd3fc;
  --idle: #8c84b0;
  --ink: #0b0a10;
  --pink: #ff4fd8;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; background: #000; color: var(--tx); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: default; }
input, textarea, select { font: inherit; color: var(--tx); }
p { margin: 0; }
::selection { background: rgba(139, 92, 246, 0.45); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2c2a36; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

.viewport { position: fixed; inset: 0; background: radial-gradient(1200px 700px at 70% 0%, #120f1f 0%, #000 60%); }
.stage { position: absolute; left: 50%; top: 50%; transform-origin: center; overflow: clip; background: linear-gradient(160deg, #050507 0%, #0d0c12 100%); border-radius: 6px; box-shadow: 0 30px 120px rgba(0, 0, 0, 0.8); }
.stage::before { content: ''; position: absolute; width: 1000px; height: 1000px; right: -380px; top: -420px; background: radial-gradient(closest-side, rgba(124, 58, 237, 0.28), transparent); pointer-events: none; }
.stage::after { content: ''; position: absolute; width: 900px; height: 900px; left: -320px; bottom: -520px; background: radial-gradient(closest-side, rgba(67, 56, 202, 0.18), transparent); pointer-events: none; }

.menubar { position: relative; z-index: 5; height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 13px; background: rgba(0, 0, 0, 0.55); color: #e9e5f7; }
.menubar b { font-weight: 600; }
.mb-apple { font-size: 12px; }
.mb-r { margin-left: auto; display: flex; gap: 18px; }
.desk { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; overflow: clip; }
.ss, .ss-body, .swap, .swap-item, .main, .vsc, .vsc-body { overflow: clip; }

/* ------------------------------------------------ transitions */
.swap { position: relative; width: 100%; height: 100%; }
.swap-item { position: absolute; inset: 0; animation-fill-mode: both; animation-timing-function: var(--ease); }
.swap-leave { pointer-events: none; }
.swap-fade.swap-enter { animation-name: fadeIn; }
.swap-fade.swap-leave { animation-name: fadeOut; }
.swap-zoom.swap-enter { animation-name: zoomIn; }
.swap-zoom.swap-leave { animation-name: fadeOut; }
.swap-rise.swap-enter { animation-name: riseIn; }
.swap-rise.swap-leave { animation-name: riseOut; }
.swap-slide.swap-enter { animation-name: slideIn; }
.swap-slide.swap-leave { animation-name: slideOut; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.94) translateY(12px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes riseOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); filter: blur(4px); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-12px); } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

/* ------------------------------------------------ atoms */
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub); text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.label.ac { color: var(--ac); }
.label.bad { color: var(--fail); }
.label.wait { color: var(--wait); }
.sub { color: var(--sub); font-size: 13px; }
.mono { font-family: var(--mono); }
.link { color: var(--ac); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
.link:hover { color: #ded5ff; text-decoration: underline; text-underline-offset: 3px; }
.kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line2); background: #1a1920; color: var(--sub); }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 9px; font-size: 14px; font-weight: 600; transition: transform 160ms var(--ease), background 160ms, box-shadow 200ms, opacity 160ms; white-space: nowrap; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn-primary { background: #f4f3f8; color: var(--ink); box-shadow: 0 4px 18px rgba(139, 92, 246, 0.32); }
.btn-primary:hover:not(:disabled) { background: #fff; box-shadow: 0 6px 26px rgba(139, 92, 246, 0.5); }
.btn-secondary { background: #1a1920; color: var(--tx); border: 1px solid var(--line2); }
.btn-secondary:hover:not(:disabled) { background: #23222b; border-color: #4d4a5e; }
.btn:disabled { opacity: 0.4; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn-wide { width: 100%; }
.hint { animation: hintGlow 1.8s ease-in-out infinite; }
@keyframes hintGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(196, 181, 253, 0), 0 4px 18px rgba(139, 92, 246, 0.3); } 50% { box-shadow: 0 0 0 5px rgba(196, 181, 253, 0.22), 0 0 30px rgba(139, 92, 246, 0.55); } }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: var(--sub); transition: background 150ms, color 150ms; }
.icon-btn:hover { background: #23222b; color: var(--tx); }
.icon-btn.round { border-radius: 50%; border: 1px solid var(--line2); }

.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: background 400ms, color 400ms, border-radius 300ms, box-shadow 300ms, transform 200ms; border: 1px solid transparent; }
.tag-sm { height: 22px; padding: 0 8px; font-size: 11.5px; gap: 5px; }
.tag-idle { background: #2a2833; border-color: #8c84b0; color: #ece8f7; }
.tag-run { background: var(--ac2); color: #fff; }
.tag-pass { background: var(--pass); color: var(--ink); }
.tag-fixed { background: var(--pass); color: var(--ink); border: 1.5px solid var(--fail); }
.tag-fail { background: var(--fail); color: var(--ink); border-radius: 5px; }
.tag-wait { background: var(--wait); color: var(--ink); }
.tag-q { font-weight: 800; }
.tag-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; animation: pulse 1s infinite; }
.tag-click { cursor: pointer; }
.tag-click:hover { transform: translateY(-1px) scale(1.04); filter: brightness(1.08); }
.tag-ring { box-shadow: 0 0 0 3px #0b0a10, 0 0 0 5px #fff, 0 0 18px rgba(255, 255, 255, 0.5); }
.tag-wait.tag-ring { box-shadow: 0 0 0 3px #0b0a10, 0 0 0 5px #fff, 0 0 22px rgba(246, 193, 119, 0.8); }

.toasts { position: absolute; z-index: 60; top: 92px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; background: #1a1920; border: 1px solid var(--line2); font-size: 13.5px; font-weight: 500; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); animation: toastIn 420ms var(--ease) both; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); }
.toast-pass .toast-dot { background: var(--pass); }
.toast-fail .toast-dot { background: var(--fail); border-radius: 2px; }
.toast-wait .toast-dot { background: var(--wait); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(0.96); } to { opacity: 1; transform: none; } }
.spinner { display: inline-block; border: 2px solid; border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }

.panel { position: relative; background: rgba(17, 16, 22, 0.94); border: 1px solid #34313f; border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; height: 44px; }
.panel-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.chips { display: flex; gap: 6px; }
.chip { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #1f1e26; color: var(--sub); border: 1px solid var(--line); transition: all 150ms; }
.chip:hover { color: var(--tx); }
.chip.on { background: var(--ac); color: var(--ink); border-color: var(--ac); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #1a1920; border: 1px solid var(--line); }
.seg button { height: 30px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--sub); transition: all 160ms; }
.seg button:hover { color: var(--tx); }
.seg button.on { background: #f4f3f8; color: var(--ink); font-weight: 600; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.seg.sm button { height: 24px; padding: 0 10px; font-size: 12px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #3b82f6; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.pill { height: 24px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; border: 1px solid; }
.pill-pass { color: var(--pass); border-color: rgba(134, 212, 194, 0.5); background: rgba(134, 212, 194, 0.08); }
.pill-fixed { color: var(--fail); border-color: rgba(255, 143, 126, 0.5); background: rgba(255, 143, 126, 0.08); }
.pill-wait { color: var(--wait); border-color: rgba(246, 193, 119, 0.5); background: rgba(246, 193, 119, 0.08); }
.pill-fail { color: var(--fail); border-color: var(--fail); }
.yours-chip { position: absolute; top: 14px; left: 14px; padding: 2px 7px; border-radius: 999px; background: var(--ac2); color: #fff; font-size: 10px; font-weight: 700; z-index: 2; }
.yours-chip.static { position: static; display: inline-block; font-size: 11px; padding: 3px 8px; }
.live { position: absolute; top: 4px; left: 4px; font-size: 8px; font-weight: 800; color: #fff; background: rgba(239, 68, 68, 0.9); padding: 1px 4px; border-radius: 3px; animation: pulse 1.4s infinite; }
.live.inline { position: static; font-size: 10px; padding: 2px 6px; }
.progress { height: 6px; border-radius: 6px; background: #23222b; overflow: hidden; margin: 12px 0 8px; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--ac2), var(--ac)); border-radius: 6px; transition: width 120ms; }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.legend::before { content: ''; width: 3px; height: 14px; border-radius: 2px; }
.lg-run { color: var(--sky); } .lg-run::before { background: var(--sky); }
.lg-fail { color: var(--fail); } .lg-fail::before { background: var(--fail); }
.lg-agent { color: var(--ac); } .lg-agent::before { background: var(--ac2); }

/* ------------------------------------------------ mascot (the SpecSight eye) */
.mascot { position: relative; display: inline-block; flex: none; filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.35)); transition: filter 500ms; }
.mascot.is-sealed { filter: drop-shadow(0 0 10px rgba(134, 212, 194, 0.55)); }
.mascot-click { cursor: pointer; }
.mascot svg { display: block; }
.iris-sweep { animation: sweep 1.6s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.iris-run { animation: irisRun 1s ease-in-out infinite; }
@keyframes irisRun { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
.iris-ripple { animation: ripple 1s var(--ease) both; }
@keyframes ripple { from { transform: scale(1); opacity: 0.95; } to { transform: scale(1.9); opacity: 0; } }
.iris-seal { stroke-dasharray: 100; animation: seal 1.2s var(--ease) both; }
@keyframes seal { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.peek { position: absolute; z-index: 300; width: 330px; padding: 12px; border-radius: 12px; background: #15141b; border: 1px solid var(--line2); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65); display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: default; animation: riseIn 200ms var(--ease) both; }
.peek-below { top: calc(100% + 10px); left: -8px; }
.peek-right { left: calc(100% + 14px); top: -10px; }
.peek-above { bottom: calc(100% + 10px); right: -8px; }
.peek-h { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.peek-h b { font-size: 14px; }
.peek-h .sub { font-size: 12px; }
.peek-r { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.peek-t { flex: 1; color: #e6e2f3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peek-s { font-size: 11.5px; font-weight: 600; white-space: nowrap; }

/* back button + resize handles */
.back-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px; border-radius: 9px; font-size: 14px; font-weight: 600; background: #1a1920; border: 1px solid var(--line2); color: var(--tx); transition: all 150ms; white-space: nowrap; flex: none; }
.back-btn:hover { background: #262430; border-color: var(--ac); }
.back-btn:active { transform: scale(0.97); }
.sash { position: relative; flex: none; z-index: 6; }
.sash-x { width: 6px; margin: 0 -3px; cursor: col-resize; }
.sash-y { height: 6px; margin: -3px 0; cursor: row-resize; }
.sash::after { content: ''; position: absolute; inset: 0; background: transparent; transition: background 150ms; border-radius: 3px; }
.sash:hover::after, .sash.on::after { background: rgba(139, 92, 246, 0.6); }
body.dragging, body.dragging * { cursor: inherit !important; user-select: none !important; }

/* ------------------------------------------------ intro */
.intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.intro-glow { position: absolute; width: 900px; height: 500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(139, 92, 246, 0.18), transparent); top: 120px; }
.intro-eye { position: relative; margin-bottom: 6px; animation: zoomIn 900ms var(--ease) both; }
.intro h1 { margin: 0; font-size: 64px; letter-spacing: -0.03em; font-weight: 700; animation: riseIn 700ms var(--ease) 150ms both; }
.intro-tag { font-size: 20px; color: var(--sub); animation: riseIn 700ms var(--ease) 250ms both; }
.intro-card { position: relative; width: 640px; padding: 18px 22px; border-radius: 14px; background: rgba(17, 16, 22, 0.9); border: 1px solid #34313f; text-align: left; animation: riseIn 700ms var(--ease) 350ms both; }
.intro-card p { margin-top: 8px; font-size: 15px; line-height: 1.55; }
.intro-feats { display: flex; gap: 10px; animation: riseIn 700ms var(--ease) 450ms both; }
.intro-feats span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #111016; font-size: 13px; color: var(--sub); }
.intro .btn { margin-top: 8px; height: 46px; padding: 0 26px; font-size: 15px; animation: riseIn 700ms var(--ease) 550ms both, hintGlow 1.8s ease-in-out 1.2s infinite; }

/* ------------------------------------------------ VS Code */
.vsc { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0e0d12; }
.vsc-title { height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: var(--sub); border-bottom: 1px solid #1f1e26; background: #0b0a0f; }
.vsc-body { flex: 1; display: flex; min-height: 0; }
.vsc-act { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; background: #0b0a0f; border-right: 1px solid #1f1e26; }
.act { position: relative; width: 48px; height: 46px; display: flex; align-items: center; justify-content: center; color: #77738a; border-left: 2px solid transparent; }
.act:hover { color: #dcd8ea; }
.act.on { color: #ece8f7; border-left-color: var(--ac); }
.act-badge { position: absolute; right: 8px; bottom: 9px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--ac2); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.act-ss { margin-top: 6px; border-radius: 10px; }
.act-ss.hint { animation: hintGlow 1.8s infinite; }
.vsc-side { flex: none; background: #0e0d13; border-right: 1px solid #1f1e26; padding: 10px 0; overflow: auto; }
.side-h { font-size: 11px; letter-spacing: 0.08em; color: var(--sub); padding: 4px 16px 10px; font-weight: 600; }
.tree { display: flex; align-items: center; gap: 7px; width: 100%; height: 26px; font-size: 13px; color: #d9d5e8; text-align: left; padding-right: 12px; }
.tree.file:hover { background: #1a1922; }
.tree.on { background: #241f3a; color: #fff; }
.tree.folder { color: #c9c4dd; cursor: default; }
.caret { width: 10px; font-size: 11px; color: var(--mut); }
.ficon { font-size: 8.5px; font-weight: 800; color: #4fa3f7; letter-spacing: -0.02em; flex: none; }
.tree-n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-m { color: #e2c08d; font-size: 11px; font-weight: 700; }
.vsc-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: #0f0e14; }
.tabs { display: flex; height: 36px; background: #0b0a0f; border-bottom: 1px solid #1f1e26; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--sub); border-right: 1px solid #1f1e26; cursor: pointer; }
.tab.on { background: #0f0e14; color: #fff; border-top: 1px solid var(--ac); }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: #e2c08d; }
.tab-x { color: var(--mut); font-size: 15px; padding: 0 2px; }
.tab-x:hover { color: #fff; }
.crumbs { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 16px; font-size: 12.5px; color: var(--sub); }
.vsc-code { flex: 1; }
.squiggle-hint { cursor: pointer; text-align: left; position: absolute; left: 70px; bottom: 12px; font-size: 12px; color: #e2c08d; background: #1a1720; border: 1px solid #3a3124; border-radius: 8px; padding: 6px 10px; }
.squiggle-hint span { color: var(--mut); margin-left: 6px; }
.vsc-status { height: 24px; display: flex; align-items: center; gap: 16px; font-size: 12px; background: #0b0a0f; border-top: 1px solid #1f1e26; color: #d4d0e4; padding-right: 14px; }
.sb-remote { background: var(--ac2); color: #fff; height: 100%; padding: 0 10px; display: flex; align-items: center; font-weight: 700; }
.sb-prob .warn { color: #e2c08d; }
.sb-ss { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px; border-radius: 4px; }
.sb-ss:hover { background: #1f1d29; }
.sb-ss.pulse { color: var(--ac); }
.sb-ss.hint { animation: hintGlow 1.8s infinite; }
.sb-r { margin-left: auto; color: var(--sub); }
.vsc-toast { position: absolute; right: 18px; bottom: 40px; width: 420px; z-index: 30; background: #16151d; border: 1px solid #3a3846; border-radius: 14px; padding: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(196, 181, 253, 0.06); animation: toastUp 520ms var(--ease) both; }
@keyframes toastUp { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
.vt-head { display: flex; gap: 14px; align-items: flex-start; }
.vt-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.vt-text { font-size: 13.5px; line-height: 1.5; color: #e6e2f3; }
.vt-x { margin-left: auto; color: var(--mut); font-size: 18px; line-height: 1; }
.vt-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

.agent { width: 100%; height: 100%; display: flex; flex-direction: column; background: #0d0c12; border-left: 1px solid #1f1e26; }
.agent-h { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #1f1e26; }
.agent-model { margin-left: auto; font-size: 11.5px; color: var(--mut); }
.agent-list { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.agent-empty { margin: auto 0; text-align: center; padding: 20px; animation: fadeIn 600ms both; }
.agent-empty-t { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.agent-empty-s { font-size: 13px; color: var(--sub); line-height: 1.5; }
.msg { font-size: 13.5px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; animation: riseIn 380ms var(--ease) both; }
.msg.you { align-self: flex-end; max-width: 92%; background: #1f1c30; border: 1px solid #332e4c; }
.agent-msg { background: #15141b; border: 1px solid var(--line); }
.msg-task { font-size: 12px; color: var(--ac); margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #332e4c; }
.mt-id { font-family: var(--mono); font-size: 11.5px; color: var(--ac); background: rgba(139, 92, 246, 0.16); padding: 1px 6px; border-radius: 5px; margin-right: 4px; }
.diffcard { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #0b0a10; border: 1px solid var(--line); }
.plus { color: var(--pass); }
.minus { color: var(--fail); }
.steps { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.astep { display: flex; gap: 10px; font-size: 13px; color: #d9d5e8; animation: riseIn 320ms var(--ease) both; }
.astep-i { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; color: var(--pass); margin-top: 1px; }
.astep-d { font-size: 12px; color: var(--mut); margin-top: 2px; }
.thinking { display: flex; gap: 5px; padding: 4px 28px; }
.thinking span, .bub.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); animation: think 1s infinite; }
.thinking span:nth-child(2), .bub.typing span:nth-child(2) { animation-delay: 0.15s; }
.thinking span:nth-child(3), .bub.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes think { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.composer { position: relative; margin: 12px; padding: 10px; border-radius: 14px; background: #15141b; border: 1px solid #34313f; transition: border-color 200ms; }
.composer:focus-within { border-color: #5b4f8c; }
.composer.hint { animation: hintGlow 1.8s infinite; }
.composer.off { opacity: 0.6; }
.composer textarea { width: 100%; min-height: 56px; resize: none; background: transparent; border: 0; outline: none; font-size: 13.5px; line-height: 1.5; }
.composer textarea::placeholder { color: #8b85a6; }
.composer-foot { display: flex; align-items: center; gap: 8px; }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; }
.sug { font-size: 12px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line2); color: #ddd8ee; background: #1a1920; transition: all 150ms; }
.sug:hover { border-color: var(--ac); color: #fff; }
.send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; background: #f4f3f8; color: var(--ink); display: flex; align-items: center; justify-content: center; transition: transform 150ms, opacity 150ms; }
.send:disabled { opacity: 0.35; }
.send:hover:not(:disabled) { transform: scale(1.06); }
.task-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: #1a1920; border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); animation: riseIn 220ms var(--ease) both; }
.tm-h { font-size: 11px; color: var(--mut); padding: 6px 8px; }
.tm-i { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; text-align: left; padding: 8px; border-radius: 8px; background: #241f3a; }
.tm-i:hover { background: #2d2748; }
.tm-t { font-size: 13px; font-weight: 600; }
.tm-m { grid-column: 2; font-size: 11.5px; color: var(--sub); }
.task-chip { padding: 10px; border-radius: 10px; background: #0f0e14; border: 1px solid #3a3360; margin-bottom: 8px; animation: riseIn 300ms var(--ease) both; }
.tc-top { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.tc-x { margin-left: auto; color: var(--mut); font-size: 16px; }
.tc-d { font-size: 12px; color: var(--sub); margin: 6px 0; line-height: 1.45; }
.tc-specs { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: #d6d1e6; }
.tc-specs b { color: var(--ac); margin-right: 4px; }

.inv { width: 100%; height: 100%; padding: 14px 16px; background: #0d0c12; border-left: 1px solid #1f1e26; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.inv-h { display: flex; align-items: center; gap: 10px; }
.inv-task { font-size: 12.5px; color: var(--sub); }
.inv-tabs { display: flex; align-items: center; gap: 8px; }
.inv-tab { padding: 3px; border-radius: 9px; border: 1px solid transparent; }
.inv-tab.on { border-color: var(--line2); background: #1a1920; }
.inv-same { font-size: 12px; color: var(--sub); margin-left: 4px; }
.inv-title { font-size: 16px; font-weight: 600; }
.inv-row p { font-size: 13px; margin-top: 3px; }
.inv-l { margin-top: 4px; }
.inv-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.inv { gap: 8px; }
.inv-row p { margin-top: 1px; }
.inv-thumb { position: relative; text-align: left; border-radius: 8px; padding: 3px; border: 1px solid #2a2834; transition: border-color 150ms, transform 150ms; }
.inv-thumb:hover { border-color: var(--ac); transform: translateY(-1px); }
.inv-thumb.broke { border-color: var(--fail); }
.it-n { position: absolute; left: 8px; top: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--sky); color: var(--ink); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.it-n.bad { background: var(--fail); }
.it-l { display: block; font-size: 12px; margin-top: 4px; color: #ddd8ee; }
.inv-wrong { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.inv-wrong > div { display: flex; gap: 8px; align-items: center; }
.nb { width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 800; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.nb-sky { background: var(--sky); }
.nb-fail { background: var(--fail); }
.fixbox { border: 1px solid #3a3360; background: rgba(139, 92, 246, 0.07); border-radius: 12px; padding: 12px; }
.fixbox p { font-size: 13px; margin-top: 6px; line-height: 1.5; }
.inv-fixed { border: 1px solid rgba(134, 212, 194, 0.4); background: rgba(134, 212, 194, 0.06); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.5; animation: riseIn 400ms var(--ease) both; }
.inv-fixed-t { display: flex; align-items: center; gap: 8px; color: var(--pass); font-weight: 700; }
.inv-actions { display: flex; gap: 8px; margin-top: 4px; }
.inv-back { align-self: flex-start; }

/* ------------------------------------------------ code */
.code { overflow: auto; font-family: var(--mono); position: relative; }
.code-inner { padding: 8px 0 40px; min-width: max-content; }
.code-line { position: relative; display: flex; height: var(--lh); line-height: var(--lh); white-space: pre; padding-right: 20px; transition: background 400ms; }
.ln { width: 50px; text-align: right; padding-right: 18px; color: #9a93bc; flex: none; user-select: none; }
.lt { flex: none; }
.code-line.mk-agent { background: rgba(139, 92, 246, 0.13); box-shadow: inset 3px 0 0 var(--ac2); }
.code-line.mk-run { background: rgba(125, 211, 252, 0.11); box-shadow: inset 3px 0 0 var(--sky); }
.code-line.mk-step { background: rgba(125, 211, 252, 0.1); }
.code-line.mk-fail { background: rgba(255, 143, 126, 0.13); box-shadow: inset 3px 0 0 var(--fail); }
.code-line.fresh { animation: typeIn 260ms steps(12) both; }
@keyframes typeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.code-line.typing .lt::after { content: ''; display: inline-block; width: 2px; height: 15px; background: var(--ac); margin-left: 2px; vertical-align: -2px; animation: pulse 0.8s infinite; }
.code-note { position: absolute; top: 0; height: var(--lh); display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 12px; z-index: 2; animation: riseIn 400ms var(--ease) both; }
.note-text { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--sky); background: rgba(13, 30, 40, 0.95); color: #e7f6fd; white-space: nowrap; }
.note-fail .note-text { border-color: var(--fail); background: rgba(45, 20, 18, 0.95); color: #ffe2dc; }
.note-badge { width: 19px; height: 19px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; color: var(--ink); }
.nb-sky { background: var(--sky); }
.nb-fail { background: var(--fail); }
.code-note-below { display: flex; align-items: center; gap: 8px; padding: 3px 0 6px 50px; font-family: var(--sans); font-size: 12px; animation: riseIn 400ms var(--ease) both; }
.code-note-below .note-text { white-space: normal; }
.missing { display: flex; align-items: center; gap: 12px; padding: 4px 0 6px 70px; animation: riseIn 400ms var(--ease) both; }
.missing-box { border: 1.5px dashed var(--fail); background: rgba(255, 143, 126, 0.07); border-radius: 8px; padding: 6px 12px; }
.missing-code { color: #ffb4a8; font-size: 12px; }
.missing-why { font-family: var(--sans); font-size: 11px; color: #ffb4a8; margin-top: 2px; }
.missing-tags { display: flex; align-items: center; gap: 6px; font-family: var(--sans); }
.missing-both { font-size: 12px; font-weight: 600; color: var(--fail); }
.bulb { position: absolute; left: 34px; top: 0; height: var(--lh); font-size: 12px; z-index: 3; animation: pulse 1.6s infinite; }
.bulb.on { animation: none; }
.bulb-menu { position: relative; z-index: 5; margin: 2px 0 6px 70px; width: max-content; background: #1a1920; border: 1px solid var(--line2); border-radius: 10px; padding: 5px; font-family: var(--sans); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); animation: riseIn 200ms var(--ease) both; }
.bulb-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 7px; font-size: 12.5px; text-align: left; }
.bulb-menu button:hover { background: #2a2346; }

/* ------------------------------------------------ SpecSight window */
.ss { position: absolute; inset: 0; }
.ss-bar { position: relative; z-index: 4; margin: 8px 16px 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: rgba(17, 16, 22, 0.94); border: 1px solid #34313f; }
.ss-name { font-size: 16px; font-weight: 600; }
.ss-div { width: 1px; height: 20px; background: var(--line2); }
.ss-line { font-size: 13.5px; color: #e6e2f3; animation: fadeIn 500ms both; white-space: pre; }
.ss-bar-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.ss-run { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--sky); }
.ss-run-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 10px var(--sky); animation: pulse 1s infinite; }
.ss-run.paused { color: var(--wait); }
.ss-run.paused .ss-run-dot { background: var(--wait); box-shadow: none; animation: none; }
.bar-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line2); background: #1a1920; transition: all 150ms; }
.bar-btn:hover { border-color: var(--ac); }
.ss-body { position: absolute; top: 62px; left: 0; right: 0; bottom: 0; }
.main { position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px 16px 16px; }
.main > .left { width: 320px; flex: none; }
.main > .center { flex: 1; min-width: 0; }
.main > .sash-x { margin: 0 -9px; }
.right-wrap { flex: none; min-width: 0; display: flex; }
.right-wrap > .right { flex: 1; min-width: 0; }
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; padding-bottom: 2px; }
.left-fill { flex: 1; }
.left-actions { display: flex; flex-direction: column; gap: 10px; }
.center { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.right { position: relative; min-height: 0; }
.right .swap, .right .swap-item { height: 100%; }
.card { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; animation: riseIn 420ms var(--ease) both; }
.card p { font-size: 14px; line-height: 1.5; }
.task-t { font-size: 18px; font-weight: 600; line-height: 1.35; }
.task-t.sm { font-size: 15px; }
.task-m { font-size: 12.5px; color: var(--sub); }
.task-d { font-size: 13.5px; margin-top: -4px; }
.read-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.read-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; opacity: 0.18; transform: translateX(-6px); transition: all 500ms var(--ease); }
.read-row.in { opacity: 1; transform: none; }
.card-foot { font-size: 12px; color: var(--sub); }
.c-wait { border-color: var(--wait); box-shadow: 0 0 0 1px rgba(246, 193, 119, 0.2), 0 12px 40px rgba(0, 0, 0, 0.35); }
.c-wait.compact { padding: 14px 18px; gap: 8px; }
.card-note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--wait); }
.c-fail { gap: 10px; }
.fix-item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.sep { width: 100%; height: 1px; background: var(--line); margin: 2px 0; }
.fix-text { font-size: 13px !important; }
.c-run { border-color: #3a3360; }
.retest-row { display: flex; gap: 8px; }
.who { display: flex; gap: 10px; align-items: center; }
.who b { display: block; font-size: 14px; }
.who span:not(.avatar) { font-size: 12.5px; color: var(--sub); }
blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--ac2); background: #17161e; border-radius: 0 8px 8px 0; font-size: 13.5px; line-height: 1.5; }
.row-c { display: flex; align-items: center; gap: 8px; }

.lens-panel { flex: 1; min-height: 0; overflow: visible; z-index: 3; }
.lens-stage { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; display: flex; align-items: center; justify-content: center; }
.lens { position: relative; flex: none; }
.lens-inner { position: absolute; left: 0; top: 0; width: 648px; height: 420px; transform-origin: 0 0; transition: transform 480ms var(--ease); }
.lens-svg { position: absolute; inset: 0; overflow: visible; }
.seg-flow { animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
.iris-arc { transition: fill 500ms; }
.lens-count { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
.lens-count-n { font-size: 38px; font-weight: 600; letter-spacing: 0.02em; }
.lens-count-sub { font-size: 13px; color: var(--sub); margin-top: -2px; }
.lens-count.small .lens-count-n { font-size: 17px; }
.lens-count.small .lens-count-sub { display: none; }
.lens-label { position: absolute; display: flex; justify-content: center; pointer-events: none; transition: top 300ms, opacity 300ms; }
.lens-label span { padding: 3px 8px; border-radius: 6px; background: rgba(11, 10, 16, 0.85); font-size: 12.5px; font-weight: 500; text-align: center; line-height: 1.35; }
.lens-label.is-fail span { color: var(--fail); }
.lens-label.is-wait span { color: var(--wait); }
.lens-tag { position: absolute; transform: translate(-50%, -50%); z-index: 2; border-radius: 999px; }
.lens-tag.hint .tag { animation: hintGlow 1.8s infinite; }
.lens-pop { position: absolute; z-index: 20; width: 258px; animation: popIn 260ms var(--ease) both; }
@keyframes popIn { from { opacity: 0; scale: 0.92; } to { opacity: 1; scale: 1; } }
.pop { padding: 12px 14px; border-radius: 12px; background: #0b0a10; border: 1px solid #4a4562; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; gap: 4px; }
.pop-fail { border-color: var(--fail); }
.pop-wait { border-color: var(--wait); }
.pop-pass, .pop-fixed { border-color: rgba(134, 212, 194, 0.6); }
.pop-t { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.pop-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pop-l { font-size: 12.5px; color: var(--sub); line-height: 1.4; }
.pop-link { align-self: flex-start; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
.pop-link:hover { text-decoration: underline; }
.lens-caption { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; animation: fadeIn 500ms both; }
.lc-t { font-size: 20px; font-weight: 600; }
.lc-s { font-size: 13px; color: var(--sub); margin-top: 4px; }
.dots5 { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.dots5 span { width: 8px; height: 8px; border-radius: 50%; background: #3a3650; transition: background 300ms, transform 300ms; }
.dots5 span.on { background: var(--idle); transform: scale(1.2); }
.lens-banner { position: absolute; bottom: 18px; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 10px; background: #1a1920; border: 1px solid var(--line2); font-size: 13px; animation: riseIn 300ms var(--ease) both; }

.log { height: 276px; flex: none; transition: height 420ms var(--ease); overflow: hidden; }
.log.closed { height: 56px; }
.log-count { font-size: 12.5px; }
.log-cards { display: flex; gap: 8px; padding: 14px 20px 16px; overflow-x: auto; overflow-y: hidden; transition: opacity 300ms; }
.log.closed .log-cards { opacity: 0; }
.lcard { position: relative; flex: none; width: 118px; height: 204px; padding: 6px; border-radius: 10px; background: #15141b; border: 1px solid #2a2834; text-align: left; display: flex; flex-direction: column; gap: 6px; animation: cardIn 420ms var(--ease) both; transition: border-color 200ms, transform 200ms; }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
.lcard:hover { border-color: #5b5478; transform: translateY(-2px); }
.lcard.st-run { border-color: rgba(139, 92, 246, 0.7); }
.lcard.st-fail { border-color: rgba(255, 143, 126, 0.7); }
.lcard.st-wait { border-color: rgba(246, 193, 119, 0.7); }
.lcard.skeleton { border-style: dashed; border-color: #3a3650; background: transparent; justify-content: flex-end; font-size: 11.5px; color: var(--mut); animation: none; }
.lcard.yours { border-color: var(--ac); }
.lcard.just { animation: slideCard 900ms var(--ease) both; box-shadow: 0 0 0 1px var(--ac), 0 0 26px rgba(196, 181, 253, 0.5); }
@keyframes slideCard { 0% { opacity: 0; transform: translateY(-60px) scale(0.8); } 60% { opacity: 1; transform: translateY(4px) scale(1.02); } 100% { transform: none; } }
.lcard .yours-chip { top: 10px; left: 10px; }
.lc-tags { display: flex; align-items: center; gap: 4px; }
.run2 { position: absolute; top: 10px; right: 10px; font-size: 9.5px; font-weight: 700; color: var(--ink); background: var(--sky); padding: 1px 5px; border-radius: 4px; }
.lc-name { font-size: 12px; line-height: 1.35; color: #e6e2f3; flex: 1; overflow: hidden; }
.lc-time { font-size: 11px; color: var(--sub); }
.log-empty { font-size: 13px; color: var(--sub); padding: 20px; }
.thumb { position: relative; flex: none; border-radius: 5px; overflow: hidden; background: #f6f3ec; }

.codep { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.codep-h { display: flex; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.codep-f { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.codep-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.codep-h > div:first-child { min-width: 0; }
.codep-h .sub { font-size: 12.5px; }
.ss-code { flex: 1; margin: 0 8px 8px; border-radius: 10px; background: #0c0b10; border: 1px solid #23222b; }

.clarify, .ask { height: 100%; padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.clarify.compact { height: auto; padding: 0; background: none; border: 0; box-shadow: none; }
.cl-h { display: flex; align-items: center; gap: 10px; }
.cl-h .icon-btn { margin-left: auto; }
.wait-t { color: var(--wait); font-weight: 600; font-size: 14px; }
.cl-q { font-size: 17px; font-weight: 600; }
.cl-p { font-size: 13.5px; line-height: 1.5; }
.cl-thumbs { display: flex; gap: 10px; }
.cl-thumb { text-align: left; font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; padding: 3px; border-radius: 8px; border: 1px solid #2a2834; }
.cl-thumb:hover { border-color: var(--wait); }
.cl-ta { position: relative; }
.cl-ta textarea { width: 100%; height: 132px; resize: vertical; padding: 12px 14px; border-radius: 10px; background: #0c0b10; border: 1px solid #3a3846; outline: none; color: #f2eefc; font: inherit; font-size: 16px; line-height: 1.55; }
.cl-ta textarea:focus { border-color: var(--wait); }
.paste { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; background: #241f16; color: var(--wait); border: 1px solid #5a4728; }
.paste:hover { background: #2e2719; }
.cl-src { display: flex; flex-direction: column; gap: 6px; }

/* ------------------------------------------------ player */

.track { padding: 8px; border-radius: 10px; border: 1px solid transparent; transition: all 200ms; }

.cap-main { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

/* ------------------------------------------------ full map */

.fullmap.closing { clip-path: none !important; background-color: rgba(7, 6, 10, 0); transition: background-color 380ms ease 40ms; pointer-events: none; }
.fullmap.closing > .fm-main { opacity: 1; transform: none; transition: border-color 200ms; background: transparent; border-color: transparent; overflow: visible; }
.fullmap.closing > .fm-drawer, .fullmap.closing .fm-top, .fullmap.closing .fm-strip { animation: fmOut 200ms ease forwards; }
@keyframes fmOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(6px); } }
.fullmap.closing .fm-lens { transform: var(--fm-back, scale(0.6)); opacity: 0; transition: transform 420ms cubic-bezier(0.3, 0.7, 0.2, 1), opacity 140ms ease 330ms; }
.fm-lens { transform-origin: center center; }

@keyframes guideInUp { from { opacity: 0; translate: 0 -8px; } to { opacity: 1; translate: 0 0; } }
.guide-arrow { position: absolute; width: 14px; height: 14px; background: #f4f3f8; transform: translateX(-50%) rotate(45deg); }
.guide-card.below .guide-arrow { top: -7px; box-shadow: -1px -1px 0 rgba(134,212,194,.6); }
.guide-card.above .guide-arrow { bottom: -7px; box-shadow: 1px 1px 0 rgba(134,212,194,.6); }
.guide-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
.guide-step { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #145c49; background: #cff2e5; padding: 3px 8px; border-radius: 999px; }
.guide-x { font-size: 12px; font-weight: 600; color: #4b4458; text-decoration: underline; text-underline-offset: 2px; }
.guide-x:hover { color: #0b0a10; }
.guide-card b { font-size: 15.5px; font-weight: 700; position: relative; }
.guide-card p { font-size: 13.5px; line-height: 1.45; color: #2a2535; position: relative; }
.guide-card.left, .guide-card.right { animation-name: guideIn; }
.guide-card.right .guide-arrow { left: -7px; transform: translateY(-50%) rotate(45deg); box-shadow: -1px 1px 0 rgba(134,212,194,.6); }
.guide-card.left .guide-arrow { right: -7px; left: auto; transform: translateY(-50%) rotate(45deg); box-shadow: 1px -1px 0 rgba(134,212,194,.6); }
.guide-also { margin-top: 6px; padding-top: 8px; border-top: 1px solid #ddd8ea; display: flex; flex-direction: column; gap: 4px; position: relative; }
.guide-also span { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5534cc; }
.guide-also div { font-size: 12.5px; line-height: 1.35; color: #2a2535; padding-left: 14px; position: relative; }
.guide-also div::before { content: ''; position: absolute; left: 2px; top: 6px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px dashed #8b5cf6; }
.guide-opt { position: absolute; border-radius: 11px; border: 1.5px dashed rgba(196,181,253,.85); transition: left 260ms var(--ease), top 260ms var(--ease), width 260ms var(--ease), height 260ms var(--ease); animation: fadeIn 400ms both; }
.guide-opt span { position: absolute; top: -9px; right: 8px; font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0b0a10; background: #c4b5fd; padding: 2px 6px; border-radius: 5px; }
.mine-write textarea.invalid { border-color: var(--fail) !important; box-shadow: 0 0 0 3px rgba(255,143,126,.18); }
.mine-invalid { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; color: #ffd0c7; background: rgba(255,143,126,.1); border: 1px solid rgba(255,143,126,.55); animation: riseIn 260ms var(--ease) both; }
.mine-invalid svg { flex: none; margin-top: 2px; color: var(--fail); }

      />
    </section>
  );
}

  );
}

import { Button } from '../ui/Button';
import { Toast } from '../ui/Toast';

type Props = {
  email: boolean;
  onEmailChange: (on: boolean) => void;
  updates: boolean;
  onUpdatesChange: (on: boolean) => void;
  securityAlerts: 'always';
  status: 'idle' | 'saving' | 'saved' | 'error';
  onSave: () => void;
};

export function SettingsForm(props: Props) {
  return (
    <form
      className="settings-card"
      onSubmit={(event) => {
        event.preventDefault();
        props.onSave();
      }}
    >
      <Toggle
        label="Email notifications"
        hint="Mentions, assignments and comments on your projects"
        checked={props.email}
        onChange={props.onEmailChange}
      />
      <Toggle
        label="Product updates"
        hint="New features and tips, about once a month"
        checked={props.updates}
        onChange={props.onUpdatesChange}
      />
      <Toggle
        label="Security alerts"
        hint="New sign-ins and password changes"
        checked={props.securityAlerts === 'always'}
        disabled
        badge="Always on"
      />
      <Button type="submit" disabled={props.status === 'saving'}>
        {props.status === 'saving' ? 'Saving\u2026' : 'Save changes'}
      </Button>
      {props.status === 'saved' && <Toast>Changes saved</Toast>}
    </form>
  );
}
`,"preferences.ts":`export type Preferences = {
  email: boolean;
  updates: boolean;
};

const url = (userId: string) => \`/api/users/\${userId}/notification-preferences\`;

export async function loadPreferences(userId: string): Promise<Preferences> {
  const res = await fetch(url(userId));
  if (!res.ok) throw new Error('Could not load preferences');
  return res.json();
}

export async function savePreferences(userId: string, prefs: Preferences): Promise<void> {
  const res = await fetch(url(userId), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(prefs),
  });
  if (!res.ok) throw new Error('Could not save preferences');
}

  return useContext(SessionContext);
}

type Props = {
  tone: 'info' | 'error';
  action?: string;
  children: ReactNode;
};

export function Banner({ tone, action, children }: Props) {
  return (
    <div role={tone === 'error' ? 'alert' : 'status'} className={\`banner banner-\${tone}\`}>
      <p>{children}</p>
      {action && <a href="/sign-in">{action}</a>}
    </div>
  );
}
`,"Toggle.tsx":`type Props = {
  label: string;
  hint: string;
  checked: boolean;
  onChange?: (on: boolean) => void;
  disabled?: boolean;
  badge?: string;
};

export function Toggle({ label, hint, checked, onChange, disabled, badge }: Props) {
  return (
    <label className="toggle-row">
      <span>
        <strong>{label}</strong>
        <small>{hint}</small>
      </span>
      {badge && <em>{badge}</em>}
      <input
        type="checkbox"
        role="switch"
        checked={checked}
        disabled={disabled}
        onChange={(event) => onChange?.(event.target.checked)}
      />
    </label>
